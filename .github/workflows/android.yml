# SPDX-License-Identifier: AGPL-3.0-or-later
# Android: debug build + every unit test (including the contract tests that decode shared/fixtures). No secrets, no
# signing, no Firebase project: the app builds without google-services.json.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: SIP stack only inside linphoneengine
        working-directory: .
        run: |
          scripts/check-imports.sh --self-test
          scripts/check-imports.sh
      - name: Build and unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: No AMR or OpenH264 in the APK
        run: |
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Ei 'msamr|openh264'; then
            echo "The APK contains AMR or OpenH264 libraries (see NOTICE)." >&2
            exit 1
          fi
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/
