# XcodeGen specification of the FSVoip iOS app. `FSVoip.xcodeproj` is generated from this file
# (scripts/build.sh runs `xcodegen generate`) and is not committed.
name: FSVoip
options:
  bundleIdPrefix: nl.fullstackstudio
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: nl
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Core:
    path: Packages/Core
  SipEngine:
    path: Packages/SipEngine
  LinphoneEngine:
    path: Packages/LinphoneEngine
  CallController:
    path: Packages/CallController
  Pairing:
    path: Packages/Pairing
  Contacts:
    path: Packages/Contacts
  UI:
    path: Packages/UI

targets:
  FSVoip:
    type: application
    platform: iOS
    sources:
      - path: FSVoip
        excludes:
          - Info.plist
    info:
      path: FSVoip/Info.plist
      properties:
        CFBundleDisplayName: FSVoip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl, en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # voip: PushKit calls; audio: a call keeps running in the background; remote-notification: the "unpaired"
        # notice reaches the app in the background.
        UIBackgroundModes: [voip, audio, remote-notification]
        # sandbox (Debug) or production (Release); see Config/*.xcconfig.
        FSVoipPushEnvironment: $(FSVOIP_PUSH_ENV)
        CFBundleURLTypes:
          - CFBundleURLName: nl.fullstackstudio.fsvoip
            CFBundleURLSchemes: [fsvoip]
        NSContactsUsageDescription: FSVoip leest de contacten van deze telefoon om bij een gesprek de naam te tonen en om nummers te kiezen. Ze blijven op je telefoon.
        NSCameraUsageDescription: FSVoip gebruikt de camera om de QR-code te scannen waarmee je dit toestel koppelt.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: FSVoip gebruikt de microfoon zodat de ander je kan horen tijdens een gesprek.
    entitlements:
      path: FSVoip/FSVoip.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:fullstackstudio.nl
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The script below deletes frameworks from the bundle, which the script sandbox does not allow.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        # Drops load commands of dylibs the app never uses (the AMR, H.264 and tester frameworks of linphone-sdk),
        # so the script below can remove them from the bundle without the app failing to launch.
        OTHER_LDFLAGS: "$(inherited) -Wl,-dead_strip_dylibs"
    postBuildScripts:
      # linphone-sdk's Swift Package ships AMR and OpenH264 (patent-encumbered codecs, also disabled at runtime in
      # LinphoneSipEngine) and two test frameworks. FSVoip does not ship them; mediastreamer logs a failed plugin load
      # and carries on.
      - name: Remove unused linphone-sdk frameworks
        basedOnDependencyAnalysis: false
        # As inputs so Xcode runs this after it has embedded the package frameworks (otherwise it can run first).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/msamr.framework
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/msopenh264.framework
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/linphonetester.framework
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/bctoolbox-tester.framework
        script: |
          set -euo pipefail
          dir="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          for fw in msamr msopenh264 linphonetester bctoolbox-tester; do
            rm -rf "${dir}/${fw}.framework"
          done
    dependencies:
      - package: Core
      - package: SipEngine
      - package: LinphoneEngine
      - package: CallController
      - package: Pairing
      - package: Contacts
        product: FSContacts
      - package: UI

schemes:
  FSVoip:
    build:
      targets:
        FSVoip: all
    test:
      config: Debug
      targets:
        - package: Core/CoreTests
        - package: SipEngine/SipEngineTests
        - package: Pairing/PairingTests
        - package: Contacts/ContactsTests
        - package: CallController/CallControllerTests
        - package: UI/UITests
        - package: LinphoneEngine/LinphoneEngineTests
    run:
      config: Debug
    archive:
      config: Release
