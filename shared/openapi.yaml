        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [contacts]
      operationId: createContact
      summary: Add a contact (every pairing may).
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
