      description: |
        Only with `Authorization: Bearer` (a token in a query string does not count). iOS: `AVURLAsset` with
        `AVURLAssetHTTPHeaderFieldsKey`. `410 gone` = the recording is past its retention period. Playing counts in the media
        limit (60 per minute per device), not in the token limit.
      security:
