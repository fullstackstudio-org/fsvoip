  /contacts:
    get:
      tags: [contacts]
      operationId: getContacts
      summary: Sync the customer's contacts (everything, or what changed since).
      description: |
        Without `since`: the complete set. With `since`: the changed contacts plus the ids deleted in the period.

        Pages follow `nextCursor`. Every page of one run carries the SAME `serverTime`; the app stores it as the next `since` only
        after the last page (`nextCursor: null`). The server subtracts 120 s from `since` (overlap), so a contact can arrive twice:
        upsert on `id`. A `since` older than 90 days is `400 invalid_request` with `code: "resync"`: do a full sync and drop what
        is not in it.
      security:
        - deviceToken: []
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 500
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
