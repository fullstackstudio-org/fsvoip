openapi: 3.1.0
info:
  title: FSVoip app API
  version: "1.0.0"
  summary: The platform API the FSVoip apps (iOS now, Android later) use to pair a phone with a PBX extension.
  description: |
    Platform-neutral contract of the FullStack Studio `voip-app` API, **v1**. The iOS and Android apps
    share this file and the fixtures in `shared/fixtures/`; each app has contract tests that decode them.

    Conventions (apply to every route):

    - JSON, `camelCase`, error codes in English. Every response carries `Cache-Control: no-store`.
    - The device token (`fss_vapp_...`) is sent **only** as `Authorization: Bearer <token>`, never in a query string.
    - Additive changes only: clients must ignore unknown response fields. Requests are strict: an unknown
      request field is a `400 invalid_request`.
    - A `401 unauthorized` on a device-token route means the pairing was revoked (portal, admin, or
      another phone took over the extension): the app removes the account.
    - The SIP password is returned **exactly once**, in the `201` response of `POST /pair`. FullStack
      Studio does not store it. `GET /me` never contains it.

    Not documented here on purpose: `POST /push/ring` (PBX to server, HMAC-signed, internal).
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: https://fullstackstudio.nl/api/voip-app/v1
    description: Production
tags:
  - name: pairing
    description: Exchange a one-time pairing token for a device token and SIP credentials.
  - name: account
    description: The paired account, internal contacts, push registration, the own extension (`/me/extension`).
  - name: pbx
    description: 'Manage the PBX from the app ("Centrale"): extensions, ring groups, opening hours, numbers as a chain, sounds, inviting a colleague. Admin pairings only.'
  - name: calls
    description: Calls, call recordings, voicemail and parked calls.
  - name: contacts
    description: The customer's address book and contact lists.
paths:
  /pair:
    post:
      tags: [pairing]
      operationId: pair
      summary: Exchange a pairing token (QR or deep link) for a device token and the SIP credentials.
      description: |
        The pairing token comes from the QR code / universal link
        `https://fullstackstudio.nl/fsvoip/pair?t=<token>` (or `fsvoip://pair?t=<token>`). It is single use
        and valid for 10 minutes. Rate limit: 20 per hour per IP.

        An unknown, expired, used or malformed token is one neutral `404 not_found`. If the PBX could not
        issue a new SIP password right now the response is `503` with `retryable: true` and the token is
        **not** consumed: try again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "201":
          description: Paired. Contains the SIP password; store it in the Keychain/Keystore only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Labels, internal contacts and the SIP server of this account (no password).
      security:
        - deviceToken: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [account]
      operationId: patchMe
      summary: Set or clear the alias (label override) of this account.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePatchRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MePatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /push-token:
    put:
      tags: [account]
      operationId: putPushToken
      summary: Register or replace the push token of this installation; send no token to unregister.
      description: |
        iOS sends the PushKit (VoIP) token as `pushToken` with `pushKind: apns_voip`, and the regular APNs
        token as `alertPushToken` (used for "account removed" notices; a PushKit token can only receive
        VoIP pushes). A new token clears an earlier "invalid" mark. Android uses `pushKind: fcm`.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenUpdate"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /unpair:
    post:
      tags: [account]
      operationId: unpair
      summary: The app removes itself. The device token dies and the SIP password is renewed on the PBX.
      security:
        - deviceToken: []
      responses:
        "200":
          description: Unpaired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me/extension:
    get:
      tags: [account]
      operationId: getMeExtension
      summary: The own extension - do not disturb, forwarding, voicemail - for every role.
      description: |
        The extension comes from the pairing, never from the request. Besides the settings the answer lists the numbers of the PBX
        (`isDefault` = the default number of the PBX; `defaultNumber` = the number this extension calls out with by default, see
        "Caller choice header" in `shared/README.md`) and the targets a call may be forwarded to (a colleague, a ring group, a
        voicemail box or an external number; never the extension itself). Also readable while the PBX is frozen.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The own extension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfExtension"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [account]
      operationId: patchMeExtension
      summary: Change settings of the own extension.
      description: |
        Only the keys of `SelfExtensionPatch` (everything else that exists on an extension, for example `suspended` or `recordCalls`, is
        `403 forbidden` with the `field`; a key that does not exist is `400 invalid_request`). `version` is required: another version is
        `409 stale` with the current `version`. The number to call out with is not a setting: the app chooses it per call. Writes: 60 per
        10 minutes per device.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfExtensionPatch"
      responses:
        "200":
          description: "Saved. `extension` is the fresh state (best effort: absent when it could not be read right now)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfExtensionPatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BlockedDestination"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/overview:
    get:
      tags: [pbx]
      operationId: getPbxOverview
      summary: The call flow per number plus the counters (admin pairings only).
      description: |
        All `/pbx/*` routes need `role: admin` (`GET /me`). A `user` pairing gets `403 forbidden` before anything is loaded.
        The PBX is always the one of this pairing; no id in a URL can point at another PBX (that is `404 not_found`).
      security:
        - deviceToken: []
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbxOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/devices:
    get:
      tags: [pbx]
      operationId: getPbxDevices
      summary: The extensions with their settings, and everything a call can be forwarded to.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The extensions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbxDevices"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/devices/{id}:
    patch:
      tags: [pbx]
      operationId: patchPbxDevice
      summary: Change settings of one extension.
      description: |
        `version` (from `GET /pbx/devices`) is required: another version is `409 stale` with the current `version`. Name, e-mail,
        recording, suspending and sounds are not changeable here (they stay in the portal). Writes: 60 per 10 minutes per device.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbxDevicePatch"
      responses:
        "200":
          description: "Saved. The PBX is updated in the background (`sync: pending` until then)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BlockedDestination"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/ring-groups:
    get:
      tags: [pbx]
      operationId: getPbxRingGroups
      summary: The ring groups, the extensions that can join and the forwarding choices.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The ring groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbxRingGroups"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [pbx]
      operationId: createPbxRingGroup
      summary: Create a ring group.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbxRingGroupCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbxRingGroupCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BlockedDestination"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/ring-groups/{id}:
    patch:
      tags: [pbx]
      operationId: patchPbxRingGroup
      summary: Change a ring group (`version` required).
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbxRingGroupPatch"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BlockedDestination"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/hours:
    get:
      tags: [pbx]
      operationId: getPbxHours
      summary: The opening hours, forwarding choices and the fixed holidays.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The opening hours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbxHours"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/hours/{id}:
    patch:
      tags: [pbx]
      operationId: patchPbxHours
      summary: Change week, targets and holidays of opening hours (`version` required; the name stays in the portal).
      description: "`week` and `holidays` REPLACE the whole list: send the existing entries along to keep them."
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbxHoursPatch"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BlockedDestination"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/numbers/{id}/routing:
    patch:
      tags: [pbx]
      operationId: patchPbxNumberRouting
      summary: "Where callers of one number go (`target: null` = the start of the flow)."
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbxRoutingPatch"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BlockedDestination"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/numbers:
    get:
      tags: [pbx]
      operationId: getPbxNumbers
      summary: The numbers of the PBX with a one-line summary of their chain (admin only).
      description: |
        `mode: advanced` = the flow behind the number is more than the app can show as a chain (opening hours, welcome message, forwarding):
        it is shown read-only and only the name can be changed.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbxNumbersPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/numbers/{id}/chain:
    get:
      tags: [pbx]
      operationId: getPbxNumberChain
      summary: One number as a chain - opening hours, welcome message, forwarding - plus recording and the choices (admin only).
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: The chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberChain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/numbers/{id}/chain/{step}:
    put:
      tags: [pbx]
      operationId: putPbxNumberChainStep
      summary: Change one step of the chain of a number (admin only).
      description: |
        `step` is `name`, `hours`, `welcome`, `forwarding` or `closed` (any other step is `404 not_found`). The body is strict: only the keys
        of that step (`ChainStepRequest`) plus `versions` (`{ <objectId>: version }`, the versions the chain showed) and `numberVersion`;
        left out = the server reads them itself. A left-out `Fallback` field stays as it was. A `Fallback` with `mode: other` is `400`
        (it is read-only). Nothing is ever deleted: switching a step "off" only unlinks it. Writes: 60 per 10 minutes per device.

        Answers with the fresh `NumberChain`. `409 stale` carries the fresh chain in `chain` (keep the typed values, show the new
        state); `409 advanced` = the flow is too complex for the chain; `400 invalid_request` with `code` (for example
        `greeting_required`: a welcome message needs a sound); `422 blocked_destination`; `409 read_only`.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: step
          in: path
          required: true
          schema:
            type: string
            enum: [name, hours, welcome, forwarding, closed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChainStepRequest"
      responses:
        "200":
          description: "Saved. The PBX is updated in the background (`sync: pending` until then)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberChain"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BlockedDestination"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/numbers/{id}/recording:
    patch:
      tags: [pbx]
      operationId: patchPbxNumberRecording
      summary: Switch call recording of a number on or off (admin only).
      description: |
        Recording is paid per number per month. When it costs something and `costAccepted` is not `true` the answer is
        `422 cost_not_accepted` with the `cost` (the price per number per month; `vatIncluded` says whether `priceE4` includes VAT):
        show it and send the request again with `costAccepted: true`. The optional announcement is a sound of the PBX; it is only played
        to inbound callers. Answers with the fresh `NumberChain`.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberRecordingPatch"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberChain"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: "`cost_not_accepted`: the recording costs money and was not accepted yet; `cost` holds the price."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/sounds:
    get:
      tags: [pbx]
      operationId: getPbxSounds
      summary: The sounds of the PBX - welcome messages, music, greetings (admin only).
      security:
        - deviceToken: []
      responses:
        "200":
          description: The sounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [pbx]
      operationId: uploadPbxSound
      summary: Upload a sound (admin only).
      description: |
        `multipart/form-data` with exactly two parts, `name` and `file` (any other part, a repeated part or a `chunked` body is `400`).
        The type is read from the first bytes of the file (WAV, MP3 or M4A), never from the file name or the content type of the part. Up
        to 20 MB; a bigger body is `413 too_large` without being read. `400 invalid_audio` = not a supported audio file; `409 too_many` =
        the PBX has the maximum number of sounds. Uploads: 20 per hour per device.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded. The PBX learns the sound in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundUploadResponse"
        "400":
          description: "`invalid_audio` (not a supported audio file) or another `invalid_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
