        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/sounds/{id}/audio:
    get:
      tags: [pbx]
      operationId: getPbxSoundAudio
      summary: The audio of a sound (admin only). Supports `Range` (206/416) and `HEAD`.
      description: |
        Only with `Authorization: Bearer`. A sound uploaded before this feature has no playable copy (`playable: false`): `404`. Playing
        counts in the media limit (60 per minute per device). Errors are JSON, also on this route.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The audio.
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: A part of the audio.
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The range does not fit the audio.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /pbx/devices/{id}/app-pairing:
    post:
      tags: [pbx]
      operationId: createPbxDeviceAppPairing
      summary: A pairing link for a colleague's extension (admin only).
      description: |
        Invites a colleague: the link pairs FSVoip on their phone with the extension `id` with role `user`. The role is always `user`
        and never comes from the request, so the body must be empty (or `{}`); any key, `role` included, is `400`. The link is a
        credential: show it once, never log it. It is valid for 10 minutes and can be used once. You cannot invite the extension of this
        pairing (`409 conflict`: it would replace this very app). 10 links per hour per PBX.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPairingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /calls:
    get:
      tags: [calls]
      operationId: getCalls
      summary: The calls of one month.
      description: |
        `admin`: all calls of the PBX, with `hasRecording`. `user`: all calls of the PBX too (the team history; `extension` and
        `extensionName` say who answered or made the call), but never a recording (`hasRecording` is always `false`, `recordingExpired`
        is absent). A server from before the team history (`capabilities.calls: own`) only sends the own extension's calls.
      security:
        - deviceToken: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
          description: "`YYYY-MM`; default the current month."
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: The calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /calls/park:
    post:
      tags: [calls]
      operationId: parkCall
      summary: Park the own running call (every role).
      description: |
        `callId` is the SIP `Call-ID` of the leg of the app (the app reads it from its own call). Which extension parks comes from the
        pairing, never from the request: another extension's Call-ID is `404 call_not_found`. The call is put on hold in a numbered slot;
        anyone dials `retrieveNumber` (`*59NN`) as a normal call to pick it up. After the park time-out it rings back at the extension.

        `409 no_free_slot`, `409 park_unavailable` (the PBX cannot park: module too old or not loaded; `capabilities.park` is `false`),
        `409 park_busy`. 🚨 `503 park_uncertain`: the PBX failed while parking and the call **may be parked**. Never park again: refresh
        `GET /parked` and look. 30 per 10 minutes per device (with `DELETE /parked/{id}`).
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkRequest"
      responses:
        "201":
          description: Parked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkedCall"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`call_not_found`: no running call of this extension has that Call-ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`no_free_slot`, `park_unavailable`, `park_busy` or `read_only` (the PBX is frozen)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: "`park_uncertain` (the call may be parked: refresh the list, never retry) or another temporary problem (`unavailable`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /parked:
    get:
      tags: [calls]
      operationId: getParkedCalls
      summary: The calls parked on the PBX (every role).
      description: |
        At most 3 seconds old. `available: false` = parking does not work on this PBX right now (hide the section). `mine` = parked by
        this extension. `parkedBy` is `null` when the call was parked outside FullStack Studio.
      security:
