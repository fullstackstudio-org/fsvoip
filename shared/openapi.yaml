              schema:
                $ref: "#/components/schemas/ContactDetailResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /contacts/lookup:
    get:
      tags: [contacts]
      operationId: lookupContactByNumber
      summary: Who is calling? The contact of this customer with that number, with context.
      description: |
        The customer card of an incoming call (rate limit 120/min per device). Only the contacts of the customer of this device are
        searched. Unknown, suppressed (privacy) and ambiguous (several contacts on one number) are all `200` with `contact: null`
        (`ambiguous: true` only for the last). `counters` count what is open on the website of the customer; `timeline` holds the last
        10 lines (a title and an optional summary, never event data). The app waits at most one second for this answer on an incoming
        call and shows nothing when it is not in time.
      security:
        - deviceToken: []
      parameters:
        - name: number
          in: query
          required: true
          schema:
            type: string
            maxLength: 40
      responses:
        "200":
          description: The lookup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactLookup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /contacts/{id}/timeline:
    get:
      tags: [contacts]
      operationId: getContactTimeline
      summary: The timeline of one contact of this customer, newest first.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactTimelinePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /contacts/{id}:
    get:
      tags: [contacts]
      operationId: getContact
      summary: One contact with notes and lists.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [contacts]
      operationId: updateContact
      summary: Change a contact (every pairing may).
      description: |
        `expectedUpdatedAt` is REQUIRED: the `updatedAt` the app showed. Another value is `409 stale`. `null` for a text field wipes it;
        a left-out key is unchanged; `phones`, `tags` and `listIds` replace the whole set.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateRequest"
      responses:
        "200":
          description: "Saved (`changed: false` = nothing was different)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactUpdateResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [contacts]
      operationId: deleteContact
      summary: Delete a contact for good (admin pairings only).
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /contact-lists:
    get:
      tags: [contacts]
      operationId: getContactLists
      summary: The contact lists with their version.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactLists"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /contact-lists/{id}/contacts:
    get:
      tags: [contacts]
      operationId: getContactListSnapshot
      summary: The snapshot of one list, with its version as `ETag`.
      description: |
        `If-None-Match` equal to the current version (exact, `W/`, a list, or `*`) answers `304` with the `ETag` and no body. Lists above
        500 contacts come in pages via `cursor`; the cursor carries the version, and a version change halfway is `409 stale`
        (start again). `If-None-Match` is ignored on a cursor page.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: cursor
          in: query
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The snapshot.
          headers:
            ETag:
              schema:
                type: string
              description: The list version in quotes, e.g. `"3"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListSnapshot"
        "304":
          description: Unchanged since `If-None-Match`.
          headers:
            ETag:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VoicemailRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
      description: The sealed `ref` of a voicemail message.
    Locale:
      name: locale
      in: query
      schema:
        type: string
        enum: [nl, en]
      description: Language of the labels and country names; default from `Accept-Language`, then Dutch.
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: "fss_vapp_<43 base64url characters>"
      description: Device token returned by `POST /pair`. Only valid in the `Authorization` header.
  schemas:
    Role:
      type: string
      enum: [user, admin]
      description: |
        `admin` = this pairing may manage the PBX from the app (chosen in the portal when the code is made, changeable later; a
        change sends a `refresh` push). Anything else counts as `user`. Absent in the answer of a server from before roles existed.
    Capabilities:
      type: object
      description: |
        What the app may show for the role. Informational; the server enforces every route. All fields are additive: a server from before
        a field existed leaves it out, and a client reads a missing or unknown value as the restrictive choice.
      properties:
        pbxManage:
          type: boolean
        recordings:
          type: boolean
        voicemail:
          type: string
          enum: [all, own, none]
        calls:
          type: string
          enum: [all, team, own]
          description: |
            `all` = every call of the PBX with recordings (admin); `team` = every call of the PBX without recordings (`user`; `extension` /
            `extensionName` say who answered); `own` = only the calls of the own extension (a server from before `team`).
        contacts:
          type: object
          properties:
            read:
              type: boolean
            write:
              type: boolean
            delete:
              type: boolean
        selfExtension:
          type: boolean
          description: "`GET`/`PATCH /me/extension` is available (every role)."
        sounds:
          type: string
          enum: [manage, none]
          description: "`manage` = the sounds routes (`/pbx/sounds/**`) are open (admin)."
        invite:
          type: boolean
          description: "`POST /pbx/devices/{id}/app-pairing` is open: the admin may invite a colleague."
        park:
          type: boolean
          description: |
            Parking works on this PBX (last known state; no PBX call). `false` = do not show the park button or the "On hold" tab.
        callerChoice:
          type: boolean
          description: |
            The PBX understands the `X-FSS-From` header and has two or more numbers (last known state). Only then may the app choose the
            number to call out with, see "Caller choice header" in `shared/README.md`. `false` = never send the header.
    PbxState:
      type: string
      enum: [active, frozen, setup, error]
    PbxStatus:
      type: object
      required: [name, state, readOnly]
      properties:
        name:
          type: string
        state:
          $ref: "#/components/schemas/PbxState"
        readOnly:
          type: boolean
          description: "Frozen, still being set up or in an error state: every `/pbx/*` change answers `409 read_only`."
    SyncState:
      type: string
      enum: [ok, pending, error]
      description: "`pending` = the PBX does not run the latest settings yet (\"wordt bijgewerkt\"); `error` = it did not work."
    TargetType:
      type: string
      enum: [extension, ring_group, queue, ivr, business_hours, voicemail, recording, hangup, external]
    Target:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/TargetType"
        id:
          type: string
          format: uuid
          description: An object of this PBX (never a PBX uuid). Not for `hangup` and `external`.
        number:
          type: string
          description: "`external` only."
    TargetOption:
      type: object
      required: [value, type, name]
      description: A choice for "where does the call go".
      properties:
        value:
          type: string
          description: "`type:id`, `external` or `none`."
        type:
          $ref: "#/components/schemas/TargetType"
        id:
          type: ["string", "null"]
        name:
          type: string
        extension:
          type: ["string", "null"]
        ofDevice:
          type: boolean
          description: The voicemail of an extension (as opposed to a shared mailbox).
    NumberRef:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
    FlowWhen:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [open, closed, no_answer, busy, timeout, key, no_choice, forward_always]
        seconds:
          type: integer
        digit:
          type: string
    FlowBranch:
      type: object
      required: [when, node]
      properties:
        when:
          $ref: "#/components/schemas/FlowWhen"
        node:
          $ref: "#/components/schemas/FlowNode"
    FlowNode:
      type: object
      required: [kind]
      description: One step of the call flow of a number, as a tree.
      properties:
        kind:
          type: string
          enum: [extension, ring_group, queue, ivr, business_hours, voicemail, recording, hangup, external, missing, loop, none, more]
        id:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        extension:
          type: ["string", "null"]
        ofDevice:
          type: boolean
        number:
          type: ["string", "null"]
        dnd:
          type: boolean
        branches:
          type: array
          items:
            $ref: "#/components/schemas/FlowBranch"
    PbxNumber:
      type: object
      required: [id, number, version, sync]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: National, without country code.
        routing:
          oneOf:
            - $ref: "#/components/schemas/Target"
            - type: "null"
          description: "`null` = the start of the flow of the PBX."
        blockListId:
          type: ["string", "null"]
        isDefault:
          type: boolean
        version:
          type: integer
          minimum: 1
        sync:
          $ref: "#/components/schemas/SyncState"
        recordCalls:
          type: boolean
        recordAnnouncementSoundId:
          type: ["string", "null"]
        recordBillingActive:
          type: boolean
        flow:
          $ref: "#/components/schemas/FlowNode"
    PbxOverview:
      type: object
      required: [pbx, numbers, deviceCount, ringGroupCount, outboundBlocked]
      properties:
        pbx:
          $ref: "#/components/schemas/PbxStatus"
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/PbxNumber"
        entryFlow:
          oneOf:
            - $ref: "#/components/schemas/FlowNode"
            - type: "null"
        deviceCount:
          type: integer
        connectedCount:
          type: ["integer", "null"]
          description: "`null` = the PBX did not answer."
        ringGroupCount:
          type: integer
        outboundBlocked:
          type: boolean
          description: Calling out is temporarily off (fraud guard or administrative hold).
    FollowMeStep:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          $ref: "#/components/schemas/Target"
        delaySeconds:
          type: integer
          minimum: 0
          maximum: 120
        timeoutSeconds:
          type: integer
          minimum: 5
          maximum: 300
    PbxDevice:
      type: object
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          minimum: 1
        extension:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        voicemailEnabled:
          type: boolean
        voicemailToEmail:
          type: boolean
        voicemailAttachFile:
          type: boolean
        outboundNumberId:
          type: ["string", "null"]
        dnd:
          type: boolean
        suspended:
          type: boolean
        recordCalls:
          type: boolean
        noAnswerSeconds:
          type: integer
        noAnswerTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        busyTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        notRegisteredTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        forwardAlways:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        followMe:
          type: array
          items:
            $ref: "#/components/schemas/FollowMeStep"
        sync:
          $ref: "#/components/schemas/SyncState"
        registration:
          description: "`null` = unknown (the PBX did not answer)."
          oneOf:
            - type: object
              required: [connected, count]
              properties:
                connected:
                  type: boolean
                count:
                  type: integer
                agent:
                  type: ["string", "null"]
            - type: "null"
    PbxDevices:
      type: object
      required: [devices, targets, numbers]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PbxDevice"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetOption"
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/NumberRef"
    PbxDevicePatch:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        voicemailEnabled:
          type: boolean
        voicemailToEmail:
          type: boolean
        voicemailAttachFile:
          type: boolean
        outboundNumberId:
          type: ["string", "null"]
          description: "`null` = the first number of the PBX."
        dnd:
          type: boolean
        noAnswerSeconds:
          type: integer
          minimum: 5
          maximum: 120
        noAnswerTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        busyTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        notRegisteredTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        forwardAlways:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        followMe:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/FollowMeStep"
    RingGroupMember:
      type: object
      additionalProperties: false
      required: [extensionId]
      properties:
        extensionId:
          type: string
          format: uuid
        delaySeconds:
          type: integer
        timeoutSeconds:
          type: integer
    RingStrategy:
      type: string
      enum: [all, sequence, round]
      description: "`all` = everybody at once, `sequence` = one after the other, `round` = take turns."
    PbxRingGroup:
      type: object
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          minimum: 1
        extension:
          type: ["string", "null"]
        strategy:
          $ref: "#/components/schemas/RingStrategy"
        members:
          type: array
          items:
            $ref: "#/components/schemas/RingGroupMember"
        timeoutTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        sync:
          $ref: "#/components/schemas/SyncState"
    PbxRingGroups:
      type: object
      required: [ringGroups, devices, targets]
      properties:
        ringGroups:
          type: array
          items:
            $ref: "#/components/schemas/PbxRingGroup"
        devices:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              extension:
                type: ["string", "null"]
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetOption"
    PbxRingGroupCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        strategy:
          $ref: "#/components/schemas/RingStrategy"
        members:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RingGroupMember"
        timeoutTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
    PbxRingGroupPatch:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
        strategy:
          $ref: "#/components/schemas/RingStrategy"
        members:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RingGroupMember"
        timeoutTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
    PbxRingGroupCreated:
      type: object
      required: [ringGroupId]
      properties:
        ringGroupId:
          type: string
          format: uuid
    HoursWeekEntry:
      type: object
      additionalProperties: false
      required: [day, from, to]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = Monday ... 7 = Sunday.
        from:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        to:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
          description: "`24:00` = until midnight."
    PbxHoliday:
      type: object
      required: [name]
      properties:
        name:
          type: string
        date:
          type: ["string", "null"]
          description: "`YYYY-MM-DD` for an own date."
        rule:
          type: ["string", "null"]
          description: A fixed holiday (see `holidayRules`).
        target:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
    PbxHoursItem:
      type: object
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        extension:
          type: ["string", "null"]
        timezone:
          type: string
        week:
          type: array
          items:
            $ref: "#/components/schemas/HoursWeekEntry"
        openTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        closedTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/PbxHoliday"
        version:
          type: integer
          minimum: 1
        sync:
          $ref: "#/components/schemas/SyncState"
    PbxHours:
      type: object
      required: [hours, targets, holidayRules]
      properties:
        hours:
          type: array
          items:
            $ref: "#/components/schemas/PbxHoursItem"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetOption"
        holidayRules:
          type: array
          items:
            type: object
            required: [rule, label]
            properties:
              rule:
                type: string
              label:
                type: string
    HolidayInput:
      description: "A fixed holiday `{ rule }` or an own date `{ name, date }`."
      oneOf:
        - type: object
          additionalProperties: false
          required: [rule]
          properties:
            rule:
              type: string
        - type: object
          additionalProperties: false
          required: [name, date]
          properties:
            name:
              type: string
            date:
              type: string
              pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    PbxHoursPatch:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        week:
          type: array
          maxItems: 28
          items:
            $ref: "#/components/schemas/HoursWeekEntry"
        openTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        closedTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/HolidayInput"
        holidayTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
          description: "What happens on a holiday; `null` = the same as outside opening hours."
    PbxRoutingPatch:
      type: object
      additionalProperties: false
      required: [target, version]
      properties:
        target:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        version:
          type: integer
          minimum: 1
    CallItem:
      type: object
      required: [id, direction, outcome, startedLabel, durationLabel, hasRecording]
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum: [inbound, outbound, internal]
        outcome:
          type: string
          enum: [answered, missed, voicemail, unknown]
        number:
          type: ["string", "null"]
        ourNumber:
          type: ["string", "null"]
        extension:
          type: ["string", "null"]
        extensionName:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        lineType:
          type: ["string", "null"]
          enum: [fixed, mobile, null]
        category:
          type: ["string", "null"]
          enum: [fixed, mobile, special, short, emergency, satellite, unknown, null]
        startedLabel:
          type: string
        startedSort:
          type: ["string", "null"]
          format: date-time
        durationLabel:
          type: string
        durationSeconds:
          type: ["integer", "null"]
        hasRecording:
          type: boolean
        recordingExpired:
          type: boolean
          description: Admin only; absent for a `user` pairing.
    CallsPage:
      type: object
      required: [month, months, calls, truncated]
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        months:
          type: array
          items:
            type: string
        calls:
          type: array
          items:
            $ref: "#/components/schemas/CallItem"
        truncated:
          type: boolean
    VoicemailBox:
      type: object
      required: [id, name, shared]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        number:
          type: ["string", "null"]
        shared:
          type: boolean
    VoicemailMessage:
      type: object
      required: [ref, boxId, receivedLabel, durationLabel, isNew]
      properties:
        ref:
          type: string
          description: A sealed reference for this PBX and box. Never the message id of the PBX.
        boxId:
          type: string
          format: uuid
        boxName:
          type: string
        boxNumber:
          type: ["string", "null"]
        caller:
          type: ["string", "null"]
        callerName:
          type: ["string", "null"]
        receivedLabel:
          type: string
        receivedSort:
          type: ["string", "null"]
          format: date-time
        durationLabel:
          type: string
        isNew:
          type: boolean
        transcription:
          type: ["string", "null"]
        daysLeft:
          type: ["integer", "null"]
    VoicemailPage:
      type: object
      required: [boxes, messages, available]
      properties:
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/VoicemailBox"
        boxId:
          type: ["string", "null"]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/VoicemailMessage"
        available:
          type: boolean
    ContactPhone:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number:
          type: string
        label:
          type: string
          enum: [mobile, work, home, main, fax, other]
        isPrimary:
          type: boolean
    ContactItem:
      type: object
      required: [id, name, phones, tags, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ContactPhone"
        tags:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          description: Opaque timestamp (ISO 8601). Send it back unchanged as `expectedUpdatedAt`.
    ContactDetailItem:
      allOf:
        - $ref: "#/components/schemas/ContactItem"
        - type: object
          properties:
            notes:
              type: ["string", "null"]
            listIds:
              type: array
              items:
                type: string
                format: uuid
    ContactTimelineItem:
      type: object
      required: [id, kind, title, summary, occurredAt, ref]
      properties:
        id:
          type: string
        kind:
          type: string
          description: "The kind of line (order, ticket, call, ...). The app only uses it to pick an icon; unknown kinds are fine."
        title:
          type: string
        summary:
          type: ["string", "null"]
        occurredAt:
          type: string
          description: Opaque timestamp (ISO 8601).
        ref:
          type: ["string", "null"]
          description: A human number such as an order number.
    ContactTimelinePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactTimelineItem"
        nextCursor:
          type: ["string", "null"]
    ContactLookup:
      type: object
      required: [contact, ambiguous, doNotContact, counters, timeline]
      properties:
        contact:
          oneOf:
            - $ref: "#/components/schemas/ContactItem"
            - type: "null"
        ambiguous:
          type: boolean
        doNotContact:
          type: boolean
        counters:
          type: object
          required: [openRequests, openOrders]
          properties:
            openRequests:
              type: integer
              minimum: 0
            openOrders:
              type: integer
              minimum: 0
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/ContactTimelineItem"
    ContactsPage:
      type: object
      required: [contacts, deleted, nextCursor, serverTime]
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactItem"
        deleted:
          type: array
          items:
            type: string
            format: uuid
        nextCursor:
          type: ["string", "null"]
        serverTime:
          type: string
          description: "The same on every page of one run; keep it as the next `since` after the last page. Opaque ISO 8601 timestamp."
    ContactDetailResponse:
      type: object
      required: [contact]
      properties:
        contact:
          $ref: "#/components/schemas/ContactDetailItem"
    ContactUpdateResponse:
      type: object
      required: [contact, changed]
      properties:
        contact:
          $ref: "#/components/schemas/ContactDetailItem"
        changed:
          type: boolean
    ContactDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
    ContactLists:
      type: object
      required: [lists]
      properties:
        lists:
          type: array
          items:
            type: object
            required: [id, name, version, contactCount]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              version:
                type: integer
              contactCount:
                type: integer
    ContactListSnapshot:
      type: object
      required: [list, contacts, nextCursor]
      properties:
        list:
          type: object
          required: [id, name, version]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            version:
              type: integer
        contacts:
          type: array
          items:
            type: object
            required: [id, name, phones]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              company:
                type: ["string", "null"]
              phones:
                type: array
                items:
                  type: object
                  required: [number, label]
                  properties:
                    number:
                      type: string
                    label:
                      type: string
              email:
                type: ["string", "null"]
        nextCursor:
          type: ["string", "null"]
    ContactCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ContactPhone"
        tags:
          type: array
          items:
            type: string
        listIds:
          type: array
          items:
            type: string
            format: uuid
    ContactUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt:
          type: string
          format: date-time
          description: The `updatedAt` the app showed. Required; another value is `409 stale`.
        name:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ContactPhone"
        tags:
          type: array
          items:
            type: string
        listIds:
          type: array
          items:
            type: string
            format: uuid
    Platform:
      type: string
      enum: [ios, android]
    PushKind:
      type: string
      enum: [apns_voip, fcm]
      description: "`apns_voip` is iOS PushKit, `fcm` is Firebase Cloud Messaging (Android)."
    PushEnv:
      type: string
      enum: [production, sandbox]
      description: APNs environment of the build that registered the token.
    Transport:
      type: string
      enum: [udp, tcp, tls]
    PairRequest:
      type: object
      additionalProperties: false
      required: [token, device]
      properties:
        token:
          type: string
          pattern: "^fss_vpair_[A-Za-z0-9_-]{43}$"
        device:
          $ref: "#/components/schemas/DeviceInfo"
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        model:
          type: string
          maxLength: 64
          description: Hardware model, for the portal's device list.
        osVersion:
          type: string
          maxLength: 32
        appVersion:
          type: string
          maxLength: 32
        sipInstanceId:
          type: string
          description: "RFC 5626 `+sip.instance` value (`urn:uuid:...`). Stored for later use."
          examples: ["urn:uuid:7d2f6c1a-3b4e-4c58-9f10-5a6e8b0c2d34"]
        installId:
          type: string
          pattern: "^[a-f0-9]{8,32}$"
          description: |
            Stable id of this installation (8-32 hex characters). It becomes the Contact URI parameter
            `fss-dev=<installId>` that the PBX push gate uses to recognise this app. If omitted the
            server generates one and returns it in `device.installId`.
        pushToken:
          type: string
          description: PushKit token (iOS, hex, lowercase) or FCM token (Android).
        pushKind:
          $ref: "#/components/schemas/PushKind"
        pushEnv:
          $ref: "#/components/schemas/PushEnv"
        alertPushToken:
          type: string
          pattern: "^[a-fA-F0-9]{64,200}$"
          description: iOS only. Regular APNs token for non-call notices.
    PairResponse:
      type: object
      required: [deviceToken, device, account, sip, contacts]
      properties:
        deviceToken:
          type: string
          pattern: "^fss_vapp_[A-Za-z0-9_-]{43}$"
          description: Store in the Keychain/Keystore. Shown only here.
        device:
          type: object
          required: [id, installId]
          properties:
            id:
              type: string
              format: uuid
            installId:
              type: string
              pattern: "^[a-f0-9]{8,32}$"
        account:
          $ref: "#/components/schemas/Account"
        sip:
          $ref: "#/components/schemas/SipCredentials"
        contacts:
          $ref: "#/components/schemas/ContactsInfo"
    Account:
      type: object
      required: [id, label, pbxName, extensionName, extensionNumber, customerName]
      properties:
        id:
          type: string
          format: uuid
          description: The id of this app pairing (equals `device.id`). Used by pushes as `accountId`.
        label:
          type: string
          description: "What the app shows: the alias if set, otherwise `<pbxName> · <extensionName>`."
        labelOverride:
          type: ["string", "null"]
          description: The alias chosen on the phone. Only present in `GET /me`.
        pbxName:
          type: string
        extensionName:
          type: string
        extensionNumber:
          type: ["string", "null"]
        customerName:
          type: string
    SipCredentials:
      type: object
      required: [username, password, domain, proxy, port, transport, srv]
      properties:
        username:
          type: string
        password:
          type: string
          description: The SIP password. Returned once, in the `POST /pair` response only. Never log it.
        domain:
          type: string
          description: SIP domain of the PBX tenant, e.g. `acme.powervoip.nl`. Use as the registrar domain / realm.
        proxy:
          type: string
          description: Outbound proxy host, e.g. `sip.powervoip.nl`. Do NOT use as the domain.
        port:
          type: integer
          minimum: 1
          maximum: 65535
        transport:
          $ref: "#/components/schemas/Transport"
        srv:
          type: boolean
          const: true
          description: DNS SRV records exist for the proxy; resolve them for failover between PBX nodes.
    SipServer:
      type: object
      required: [domain, proxy, port, transport, srv]
      description: The same as `SipCredentials` but without `username` and `password`.
      properties:
        domain:
          type: string
        proxy:
          type: string
        port:
          type: integer
        transport:
          $ref: "#/components/schemas/Transport"
        srv:
          type: boolean
          const: true
    ContactsInfo:
      type: object
      required: [internal, listsAvailable]
      properties:
        internal:
          type: boolean
          const: true
          description: Internal contacts (the other extensions of this PBX) are available via `GET /me`.
        listsAvailable:
          type: integer
          minimum: 0
          description: Number of customer contact lists in the portal (`GET /contact-lists`).
        total:
          type: integer
          minimum: 0
          description: "Number of customer contacts (`GET /contacts`). Only in `GET /me`."
    MeResponse:
      type: object
      required: [account, sip, internal, contacts, push, serverTime]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        sip:
          description: "`null` when the PBX connection details are not available right now."
          oneOf:
            - $ref: "#/components/schemas/SipServer"
            - type: "null"
        internal:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/InternalContact"
        contacts:
          $ref: "#/components/schemas/ContactsInfo"
        push:
          $ref: "#/components/schemas/PushStatus"
        serverTime:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        pbx:
          $ref: "#/components/schemas/PbxStatus"
    InternalContact:
      type: object
      required: [number, name]
      properties:
        number:
          type: string
        name:
          type: string
    PushStatus:
      type: object
      required: [registered, kind, env, invalid]
      properties:
        registered:
          type: boolean
        kind:
          oneOf:
            - $ref: "#/components/schemas/PushKind"
            - type: "null"
        env:
          oneOf:
            - $ref: "#/components/schemas/PushEnv"
            - type: "null"
        invalid:
          type: boolean
          description: The push service rejected the token; the app must re-register it (`PUT /push-token`).
    MePatchRequest:
      type: object
      additionalProperties: false
      required: [labelOverride]
      properties:
        labelOverride:
          type: ["string", "null"]
          maxLength: 60
          description: The alias. `null` or an empty string clears it.
    MePatchResponse:
      type: object
      required: [label, labelOverride]
      properties:
        label:
          type: string
        labelOverride:
          type: ["string", "null"]
    PushTokenUpdate:
      type: object
      additionalProperties: false
      properties:
        pushKind:
          $ref: "#/components/schemas/PushKind"
        pushToken:
          type: ["string", "null"]
          description: Omit, `null` or empty to unregister push for this installation.
        pushEnv:
          $ref: "#/components/schemas/PushEnv"
        alertPushToken:
          type: ["string", "null"]
          description: iOS only.
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    SelfNumber:
      type: object
      required: [id, number, isDefault]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: National, without country code (`0850607848`).
        name:
          type: ["string", "null"]
        isDefault:
          type: boolean
          description: The default number of the PBX.
    SelfExtension:
      type: object
      required: [id, name, dnd, noAnswerSeconds, voicemailEnabled, voicemailToEmail, sync, version, numbers, targets]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        extension:
          type: ["string", "null"]
        dnd:
          type: boolean
        forwardAlways:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        noAnswerSeconds:
          type: integer
        noAnswerTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        voicemailEnabled:
          type: boolean
        voicemailToEmail:
          type: boolean
        email:
          type: ["string", "null"]
        sync:
          $ref: "#/components/schemas/SyncState"
        version:
          type: integer
          minimum: 1
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/SelfNumber"
        defaultNumber:
          type: ["string", "null"]
          description: The number this extension calls out with by default (its own choice in the portal, else the default number of the PBX).
        targets:
          type: array
          description: Where a call may be forwarded to (a colleague, a ring group, a voicemail box, an external number). Never the extension itself.
          items:
            $ref: "#/components/schemas/TargetOption"
    SelfExtensionPatch:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
        dnd:
          type: boolean
        forwardAlways:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        noAnswerSeconds:
          type: integer
          minimum: 5
          maximum: 120
        noAnswerTarget:
          oneOf: [{ $ref: "#/components/schemas/Target" }, { type: "null" }]
        voicemailEnabled:
          type: boolean
        voicemailToEmail:
          type: boolean
        email:
          type: ["string", "null"]
    SelfExtensionPatchResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
        extension:
          $ref: "#/components/schemas/SelfExtension"
    ChainMode:
      type: string
      enum: [simple, advanced]
      description: "`advanced` = more than the app can show as a chain: read-only, only the name can be changed."
    ForwardingKind:
      type: string
      enum: [standard, menu, advanced]
    PbxNumberEntry:
      type: object
      required: [id, number, mode, summary, sync, version]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        name:
          type: ["string", "null"]
        mode:
          $ref: "#/components/schemas/ChainMode"
        summary:
          type: object
          required: [hours, welcome, forwarding, recording]
          properties:
            hours:
              type: string
              description: A label in the language of the server ("ma-vr 9:00-17:00", "Uit").
            welcome:
              type: boolean
            forwarding:
              $ref: "#/components/schemas/ForwardingKind"
            recording:
              type: boolean
        sync:
          $ref: "#/components/schemas/SyncState"
        version:
          type: integer
          minimum: 1
    PbxNumbersPage:
      type: object
      required: [numbers]
      properties:
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/PbxNumberEntry"
    Fallback:
      description: |
        What happens when it is closed or nobody answers. `other` is something the chain has no choice for: it decodes (and is shown as
        read-only text) but is never sent back. A mode this app version does not know must be treated like `other`.
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode:
              const: voicemail
            boxId:
              type: ["string", "null"]
            ofDevice:
              type: boolean
              description: The voicemail of an extension (as opposed to a shared mailbox). Display only.
        - type: object
          required: [mode, soundId]
          properties:
            mode:
              const: message
            soundId:
              type: string
              format: uuid
        - type: object
          required: [mode, number]
          properties:
            mode:
              const: forward
            number:
              type: string
        - type: object
          required: [mode]
          properties:
            mode:
              const: hangup
        - type: object
          required: [mode, deviceId]
          properties:
            mode:
              const: device
            deviceId:
              type: string
              format: uuid
        - type: object
          required: [mode]
          properties:
            mode:
              const: other
            target:
              $ref: "#/components/schemas/Target"
    FallbackInput:
      description: "A `Fallback` the app may send. `mode: other` is not allowed (`400`)."
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              const: voicemail
            boxId:
              type: ["string", "null"]
              description: Left out = the shared voicemail box of the PBX.
        - type: object
          additionalProperties: false
          required: [mode, soundId]
          properties:
            mode:
              const: message
            soundId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [mode, number]
          properties:
            mode:
              const: forward
            number:
              type: string
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              const: hangup
        - type: object
          additionalProperties: false
          required: [mode, deviceId]
          properties:
            mode:
              const: device
            deviceId:
              type: string
              format: uuid
    ChainHolidayDate:
      type: object
      additionalProperties: false
      required: [name, date]
      properties:
        name:
          type: string
        date:
          type: string
          description: "`YYYY-MM-DD`."
    ChainHolidays:
      type: object
      required: [national, rules, dates]
      properties:
        national:
          type: boolean
          description: All Dutch national holidays use the "closed" behaviour.
        rules:
          type: array
          description: The fixed holidays that are on (see `holidayRules` of `GET /pbx/hours`).
          items:
            type: string
        dates:
          type: array
          items:
            $ref: "#/components/schemas/ChainHolidayDate"
    ChainHolidaysInput:
      type: object
      additionalProperties: false
      properties:
        national:
          type: boolean
        rules:
          type: array
          maxItems: 100
          items:
            type: string
        dates:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChainHolidayDate"
    ChainHours:
      type: object
      required: [id, version, week, holidays, closed]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        week:
          type: array
          items:
            $ref: "#/components/schemas/HoursWeekEntry"
        holidays:
          $ref: "#/components/schemas/ChainHolidays"
        closed:
          $ref: "#/components/schemas/Fallback"
        holiday:
          description: "`null` = on a holiday the same as outside opening hours."
          oneOf: [{ $ref: "#/components/schemas/Fallback" }, { type: "null" }]
        sharedWith:
          type: array
          description: Labels of the other numbers that use the same opening hours.
          items:
            type: string
    ChainWelcome:
      type: object
      required: [menuId, version]
      properties:
        menuId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        soundId:
          type: ["string", "null"]
        sharedWith:
          type: array
          items:
            type: string
    ChainMember:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId:
          type: string
          format: uuid
        delaySeconds:
          type: integer
          minimum: 0
        timeoutSeconds:
          type: integer
          minimum: 1
    ChainKey:
      type: object
      required: [digit, target]
      properties:
        digit:
          type: string
          description: "`0`-`9`, `*` or `#`."
        target:
          $ref: "#/components/schemas/Target"
        editable:
          type: boolean
          description: "`false` = a key the app shows but cannot change (for example it points at a queue); it stays as it is when the menu is saved."
    ChainStandardForwarding:
      type: object
      required: [kind, version, strategy, members, unanswered]
      properties:
        kind:
          const: standard
        groupId:
          type: ["string", "null"]
          description: "`null` = one single extension (no ring group yet); a change turns it into a ring group."
        version:
          type: integer
          minimum: 1
        strategy:
          $ref: "#/components/schemas/RingStrategy"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ChainMember"
        unanswered:
          $ref: "#/components/schemas/Fallback"
        sharedWith:
          type: array
          items:
            type: string
    ChainMenuForwarding:
      type: object
      required: [kind, menuId, version, repeats, timeoutSeconds, noChoice, keys]
      properties:
        kind:
          const: menu
        menuId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        greetingSoundId:
          type: ["string", "null"]
        repeats:
          type: integer
          minimum: 0
          maximum: 5
        timeoutSeconds:
          type: integer
        defaultKey:
          type: ["string", "null"]
          description: The key that counts when nothing is pressed; `null` = none (then `noChoice`).
        noChoice:
          $ref: "#/components/schemas/Fallback"
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ChainKey"
        sharedWith:
          type: array
          items:
            type: string
    ChainForwarding:
      oneOf:
        - $ref: "#/components/schemas/ChainStandardForwarding"
        - $ref: "#/components/schemas/ChainMenuForwarding"
    RecordingCost:
      type: object
      required: [priceE4, vatIncluded]
      properties:
        priceE4:
          type: integer
          description: The price per number per month in euro x 10000 (20000 = EUR 2.00).
        vatIncluded:
          type: boolean
          description: Whether `priceE4` includes VAT (a business customer sees it excluding VAT).
    ChainRecording:
      type: object
      required: [enabled, billingActive, available]
      properties:
        enabled:
          type: boolean
        announcementSoundId:
          type: ["string", "null"]
        billingActive:
          type: boolean
          description: Recording is already being billed; changing the announcement then needs no new consent.
        available:
          type: boolean
          description: "`false` = recording cannot be switched on on this PBX (there is no price)."
        cost:
          description: "`null` = free for this customer (no consent needed)."
          oneOf: [{ $ref: "#/components/schemas/RecordingCost" }, { type: "null" }]
    ChainOptions:
      type: object
      description: The choices for the pickers of the chain.
      properties:
        devices:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              extension:
                type: ["string", "null"]
        sounds:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        groups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
    NumberChain:
      type: object
      required: [id, number, version, mode, sync, recording, options]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        name:
          type: ["string", "null"]
        version:
          type: integer
          minimum: 1
        mode:
          $ref: "#/components/schemas/ChainMode"
        sync:
          $ref: "#/components/schemas/SyncState"
        hours:
          description: "`null` = no opening hours (the number is always open)."
          oneOf: [{ $ref: "#/components/schemas/ChainHours" }, { type: "null" }]
        welcome:
          description: "`null` = no welcome message."
          oneOf: [{ $ref: "#/components/schemas/ChainWelcome" }, { type: "null" }]
        forwarding:
          description: "`null` when `mode` is `advanced`."
          oneOf: [{ $ref: "#/components/schemas/ChainForwarding" }, { type: "null" }]
        advanced:
          description: "Only when `mode` is `advanced`: lines that describe the flow in words."
          oneOf:
            - type: object
              required: [summary]
              properties:
                summary:
                  type: array
                  items:
                    type: string
            - type: "null"
        recording:
          $ref: "#/components/schemas/ChainRecording"
        options:
          $ref: "#/components/schemas/ChainOptions"
    ChainVersionMap:
      type: object
      description: "`{ <objectId>: version }`: the versions of the parts of the chain as the chain showed them. Left out = the server reads them itself (no lost-update check for that part)."
      maxProperties: 20
      propertyNames:
        format: uuid
      additionalProperties:
        type: integer
        minimum: 1
    ChainStepName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: ["string", "null"]
          description: "`null` or empty = the number has no name."
        versions:
          $ref: "#/components/schemas/ChainVersionMap"
        numberVersion:
          type: integer
          minimum: 1
    ChainStepHours:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: "`false` = unlink the opening hours (the object stays)."
        week:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/HoursWeekEntry"
        holidays:
          $ref: "#/components/schemas/ChainHolidaysInput"
        closed:
          $ref: "#/components/schemas/FallbackInput"
        holiday:
          oneOf: [{ $ref: "#/components/schemas/FallbackInput" }, { type: "null" }]
        versions:
          $ref: "#/components/schemas/ChainVersionMap"
        numberVersion:
          type: integer
          minimum: 1
    ChainStepWelcome:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: "`true` without a sound (and none set yet) is `400 invalid_request` with `code: greeting_required`."
        soundId:
          type: ["string", "null"]
        versions:
          $ref: "#/components/schemas/ChainVersionMap"
        numberVersion:
          type: integer
          minimum: 1
    ChainStepClosed:
      type: object
      additionalProperties: false
      properties:
        closed:
          $ref: "#/components/schemas/FallbackInput"
        holiday:
          oneOf: [{ $ref: "#/components/schemas/FallbackInput" }, { type: "null" }]
        versions:
          $ref: "#/components/schemas/ChainVersionMap"
        numberVersion:
          type: integer
          minimum: 1
    ChainStepForwardingStandard:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: standard
        strategy:
          $ref: "#/components/schemas/RingStrategy"
        members:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChainMember"
        unanswered:
          $ref: "#/components/schemas/FallbackInput"
        versions:
          $ref: "#/components/schemas/ChainVersionMap"
        numberVersion:
          type: integer
          minimum: 1
    ChainStepForwardingMenu:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: menu
        greetingSoundId:
          type: ["string", "null"]
        repeats:
          type: integer
          minimum: 0
          maximum: 5
        timeoutSeconds:
          type: integer
        defaultKey:
          type: ["string", "null"]
        noChoice:
          $ref: "#/components/schemas/FallbackInput"
        keys:
          type: array
          maxItems: 100
          description: "A menu has at least one key. A key the app cannot edit (`editable: false`) is left as it is by the server."
          items:
            type: object
            additionalProperties: false
            required: [digit, target]
            properties:
              digit:
                type: string
              target:
                $ref: "#/components/schemas/Target"
              editable:
                type: boolean
        versions:
          $ref: "#/components/schemas/ChainVersionMap"
        numberVersion:
          type: integer
          minimum: 1
    ChainStepRequest:
      description: |
        The body of `PUT /pbx/numbers/{id}/chain/{step}`; which one depends on `step`: `name` = `ChainStepName`, `hours` = `ChainStepHours`,
        `welcome` = `ChainStepWelcome`, `forwarding` = `ChainStepForwardingStandard` or `ChainStepForwardingMenu` (by `kind`),
        `closed` = `ChainStepClosed`.
      anyOf:
        - $ref: "#/components/schemas/ChainStepName"
        - $ref: "#/components/schemas/ChainStepHours"
        - $ref: "#/components/schemas/ChainStepWelcome"
        - $ref: "#/components/schemas/ChainStepClosed"
        - $ref: "#/components/schemas/ChainStepForwardingStandard"
        - $ref: "#/components/schemas/ChainStepForwardingMenu"
    NumberRecordingPatch:
      type: object
      additionalProperties: false
      required: [enabled, version]
      properties:
        enabled:
          type: boolean
        announcementSoundId:
          type: ["string", "null"]
          description: "`null` = no announcement; left out = unchanged."
        costAccepted:
          type: boolean
          description: "The customer accepted the monthly price (`ChainRecording.cost`). Needed when it costs something and recording was not billed yet."
        version:
          type: integer
          minimum: 1
          description: "`NumberChain.version` (the version of the number)."
    SoundUse:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          description: "Where it is used: `voicemail_greeting`, `extension_voicemail_greeting`, `queue_music`, `queue_welcome`, `menu_greeting`, `closed_message`. Others may follow."
        name:
          type: string
          description: The name of the object that uses it (a name the customer chose).
    Sound:
      type: object
      required: [id, name, playable, sync]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        durationSeconds:
          type: ["number", "null"]
          description: "Always `null` for now: the app reads the duration from the audio."
        playable:
          type: boolean
          description: "`false` = there is no copy to play (a sound from before this feature); the PBX still uses it."
        uses:
          type: array
          items:
            $ref: "#/components/schemas/SoundUse"
        contentType:
          type: ["string", "null"]
          description: "`audio/wav`, `audio/mpeg` or `audio/mp4`; `null` without a copy."
        byteSize:
          type: ["integer", "null"]
        sync:
          $ref: "#/components/schemas/SyncState"
    SoundsPage:
      type: object
      required: [sounds]
      properties:
        sounds:
          type: array
          items:
            $ref: "#/components/schemas/Sound"
    SoundUploadResponse:
      type: object
      required: [soundId]
      properties:
        soundId:
          type: string
          format: uuid
    SoundRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    AppPairingResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: "Universal link `https://fullstackstudio.nl/fsvoip/pair?t=fss_vpair_...`. A credential: show it once, never log it."
        expiresAt:
          type: string
          format: date-time
    ParkRequest:
      type: object
      additionalProperties: false
      required: [callId]
      properties:
        callId:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^\\S+$"
          description: The SIP `Call-ID` of the leg of the app.
    ParkedBy:
      type: object
      required: [name]
      properties:
        deviceId:
          type: ["string", "null"]
          description: "The app pairing that parked it; `null` = parked from another phone of the PBX."
        name:
          type: string
    ParkedCall:
      type: object
      required: [id, slot, mine]
      properties:
        id:
          type: string
          description: Opaque, sealed per PBX (never a channel id). Use it for `DELETE /parked/{id}`.
        slot:
          type: integer
        retrieveNumber:
          type: ["string", "null"]
          description: "The number that picks the call up when dialled as a normal call (`*5901`)."
        callerNumber:
          type: ["string", "null"]
        callerName:
          type: ["string", "null"]
        parkedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: After this the call rings back at the extension that parked it.
        parkedBy:
          oneOf: [{ $ref: "#/components/schemas/ParkedBy" }, { type: "null" }]
        mine:
          type: boolean
    ParkedCallsPage:
      type: object
      required: [calls, available]
      properties:
        calls:
          type: array
          items:
            $ref: "#/components/schemas/ParkedCall"
        available:
          type: boolean
          description: "`false` = parking does not work on this PBX right now: hide the section."
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Machine-readable code. Known values: `invalid_request`, `invalid_json`, `not_found`, `unauthorized`,
            `rate_limited`, `payload_too_large`, `unavailable`, `not_ready`, `forbidden`, `read_only`, `stale`, `in_use`,
            `conflict`, `blocked_destination`, `gone`, `busy`, `advanced`, `cost_not_accepted`, `invalid_audio`, `too_large`, `too_many`,
            `call_not_found`, `no_free_slot`, `park_unavailable`, `park_busy`, `park_uncertain`. An unknown value must be treated as a
            plain failure of that HTTP status.
        message:
          type: string
          description: Human-readable detail for `invalid_request`. Not localised; do not show it to users.
        retryable:
          type: boolean
          description: "On `503`: the same request may succeed shortly (pairing token not consumed)."
        code:
          type: string
          description: |
            Detail of `invalid_request` (the portal's code, e.g. `invalid_phone`, `invalid_target`, `invalid_hours`, `greeting_required`; `resync` = the contacts
            `since` is older than 90 days) and of `conflict` (e.g. `limit_reached`).
        field:
          type: string
          description: "The request field that is wrong (`invalid_request`), or the extension field a `user` may not change (`403 forbidden` of `PATCH /me/extension`)."
        required:
          type: string
          description: "On `403 forbidden`: the role that is needed (`admin`)."
        version:
          type: integer
          description: "On `409 stale` of the PBX objects: the current version."
        places:
          type: array
          description: "On `409 in_use`: where it is still used (names the customer chose)."
          items:
            type: object
            required: [kind, name]
            properties:
              kind:
                type: string
              name:
                type: string
        blocked:
          type: array
          description: "On `422 blocked_destination`: the external numbers a block list stops."
          items:
            type: string
        cost:
          description: "On `422 cost_not_accepted`: the price the customer must accept (`null` when it could not be read)."
          oneOf: [{ $ref: "#/components/schemas/RecordingCost" }, { type: "null" }]
        chain:
          description: "On `409 stale` of a chain step or of the recording: the fresh chain (best effort)."
          $ref: "#/components/schemas/NumberChain"
  responses:
    InvalidRequest:
      description: Malformed JSON or an invalid / unknown field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unknown or revoked device token. The app must remove the account.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown, expired, used or malformed pairing token (one neutral answer).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body above 64 kB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
            description: Seconds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Temporary server or PBX problem.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "This pairing may not do that (role `user` on an admin route, or on another voicemail box). `required` = the role that is needed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The object changed in the meantime (`stale`, with the current `version` where the server knows it), or another state
        conflict: `read_only` (PBX frozen or being set up), `in_use` (with `places`), `busy`, `not_ready`, `conflict` (with `code`,
        e.g. `limit_reached`), ...
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BlockedDestination:
      description: A block list stops these external numbers (`blocked`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Gone for good (a recording past its retention period).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
